name: Project quality check

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build premium hero asset
        shell: bash
        run: |
          mkdir -p assets/media
          cat build-assets/hero-avif/part-*.b64 | tr -d '\\n\\r ' | base64 -d > assets/media/hero-casamento.avif
          echo "5ace78471f7c3cbff38ac07f49293ba7e77a5f88531aedac3df20f7938a6f1fc  assets/media/hero-casamento.avif" | sha256sum -c -

      - name: Verify production files
        shell: bash
        run: |
          required=(
            README.md index.html .gitignore SECURITY.md
            assets/stoski-logo.svg assets/logo-mark.svg assets/favicon.svg
            assets/media/hero-casamento.avif
            css/styles.css css/extra.css css/polish.css
            js/main.js robots.txt sitemap.xml site.webmanifest
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Required file missing: $file"; exit 1; }
          done

      - name: Reject private files and insecure static admin
        shell: bash
        run: |
          blocked="$(git ls-files | grep -E '(^|/)\\.env($|\\.)|\\.(pem|p12|pfx)$|(^|/)id_rsa$|(^|/)config\\.local\\.js$' || true)"
          test -z "$blocked" || { echo "Private/local files found:"; echo "$blocked"; exit 1; }
          test ! -f admin.html || { echo "Public static admin.html is not allowed."; exit 1; }
          test ! -f js/admin.js || { echo "Public admin credentials logic is not allowed."; exit 1; }

      - name: Check JavaScript syntax
        run: node --check js/main.js

      - name: Audit HTML structure and local references
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]; self.ids=[]; self.imgs=[]; self.blank=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if a.get("id"): self.ids.append(a["id"])
                  for key in ("src","href"):
                      if a.get(key): self.refs.append((tag,key,a[key]))
                  if tag=="img": self.imgs.append(a)
                  if tag=="a" and a.get("target")=="_blank": self.blank.append(a)

          p=P(); p.feed(html)
          dup={x for x in p.ids if p.ids.count(x)>1}
          assert not dup, f"Duplicate IDs: {sorted(dup)}"

          idset=set(p.ids)
          broken=[v for _,k,v in p.refs if k=="href" and v.startswith("#") and v[1:] not in idset]
          assert not broken, f"Broken anchors: {broken}"

          missing=[]
          for tag,key,value in p.refs:
              if value.startswith(("#","http://","https://","mailto:","tel:","data:")): continue
              path=urlparse(value).path
              if path and not Path(path).exists(): missing.append(f"{tag}[{key}] -> {value}")
          assert not missing, "Broken local references:\\n" + "\\n".join(missing)

          assert all("alt" in img for img in p.imgs), "Every image must have alt text."
          assert all("noopener" in a.get("rel","").split() for a in p.blank), "target=_blank must use noopener."
          assert re.search(r'<main\\b', html, re.I), "Missing main landmark."
          assert 'lang="pt-BR"' in html, "Document language must be pt-BR."
          assert not re.search(r'fotografia|fotógrafo|fotografo|ensaio fotográfico', html, re.I), "Video-only positioning violated."
          print("HTML audit OK.")
          PY

      - name: Check premium hero quality
        shell: bash
        run: |
          bytes="$(wc -c < assets/media/hero-casamento.avif)"
          test "$bytes" -ge 30000 || { echo "Hero media is too compressed: $bytes bytes"; exit 1; }
          test "$bytes" -le 120000 || { echo "Hero media is unexpectedly heavy: $bytes bytes"; exit 1; }
          signature="$(dd if=assets/media/hero-casamento.avif bs=1 skip=4 count=8 2>/dev/null)"
          test "$signature" = "ftypavif" || { echo "Hero is not a valid AVIF container."; exit 1; }
          echo "Premium hero verified: $bytes bytes"
